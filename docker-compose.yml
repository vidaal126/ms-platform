# Plataforma completa: gateway, auth, catalogo, transporte, cliente, ordem de
# venda, infraestrutura (Postgres, Kafka) e observabilidade.
#
#   docker compose up -d --build        sobe tudo (apps em container)
#   docker compose up -d postgres postgres-init kafka kafka-init kafka-ui
#                                       so a infraestrutura, para rodar apps no host
#
# Entrada publica: ms-gateway (http://localhost:8088/api/v1). As portas dos
# servicos internos ficam expostas so para desenvolvimento no host: os
# servicos confiam no gateway (x-user-*) e nao revalidam JWT.
#
# Postgres: um container, um database e um usuario por servico. O job
# postgres-init cria o que faltar a cada subida (idempotente, funciona tambem
# em volume ja existente).
#
# Kafka: listener INTERNAL (kafka:29092) para containers e EXTERNAL
# (localhost:9092) para apps no host. Auto-create desligado: todo topico vem
# do kafka-init (scripts/create-topics.sh).
#
# Observabilidade: Prometheus (metricas dos 6 servicos + lag via
# kafka-exporter), Loki + Alloy (logs JSON dos containers) e Grafana com
# datasources e dashboard provisionados (http://localhost:3300).
#
# Volumes: o do Kafka reaproveita por padrao o volume do compose antigo
# (ms-catalog_kafka_data). Para um ambiente isolado, sobrescreva
# KAFKA_VOLUME, POSTGRES_VOLUME, AUTH_KEYS_VOLUME e os de observabilidade
# (ver README).

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
  interval: 10s
  timeout: 5s
  retries: 5

x-app-base: &app-base
  restart: unless-stopped
  networks:
    - platform

x-kafka-env: &kafka-env
  KAFKA_BROKER: kafka:29092
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  # ---------------------------------------------------------------- Postgres
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # TCP em 127.0.0.1 so responde depois do initdb do proprio Postgres.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U $${POSTGRES_USER} -d postgres -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - platform

  postgres-init:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/create-databases.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog}
      TRANSPORT_DB_USER: ${TRANSPORT_DB_USER:-transport}
      TRANSPORT_DB_PASSWORD: ${TRANSPORT_DB_PASSWORD:-transport}
      TRANSPORT_DB_NAME: ${TRANSPORT_DB_NAME:-transport}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth}
      CUSTOMER_DB_USER: ${CUSTOMER_DB_USER:-customer}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:-customer}
      CUSTOMER_DB_NAME: ${CUSTOMER_DB_NAME:-customer}
      SALES_ORDER_DB_USER: ${SALES_ORDER_DB_USER:-sales_order}
      SALES_ORDER_DB_PASSWORD: ${SALES_ORDER_DB_PASSWORD:-sales_order}
      SALES_ORDER_DB_NAME: ${SALES_ORDER_DB_NAME:-sales_order}
    volumes:
      - ./scripts/create-databases.sh:/scripts/create-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform

  # ------------------------------------------------------------------- Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Mesmo CLUSTER_ID do compose antigo: obrigatorio para reabrir o volume.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - platform

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - platform

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - platform

  # ------------------------------------------------------------------ Gateway
  ms-gateway:
    <<: *app-base
    build:
      context: ${GATEWAY_CONTEXT:-../ms-gateway}
      target: production
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPSTREAM_AUTH_URL: http://ms-auth:8080
      UPSTREAM_CATALOG_URL: http://ms-catalog:8080
      UPSTREAM_TRANSPORT_URL: http://ms-transport:8080
      UPSTREAM_CUSTOMER_URL: http://ms-customer:8080
      UPSTREAM_SALES_ORDER_URL: http://ms-sales-order:8080
      AUTH_JWKS_URL: http://ms-auth:8080/.well-known/jwks.json
    ports:
      - "${GATEWAY_PORT:-8088}:8080"
    depends_on:
      ms-auth:
        condition: service_healthy
    healthcheck: *app-healthcheck

  # --------------------------------------------------------------------- Auth
  auth-keygen:
    image: node:24-alpine
    restart: "no"
    command: ["node", "/scripts/generate-auth-key.mjs"]
    volumes:
      - ./scripts/generate-auth-key.mjs:/scripts/generate-auth-key.mjs:ro
      - auth_keys:/keys
    networks:
      - platform

  auth-migrate:
    build:
      context: ${AUTH_CONTEXT:-../ms-auth}
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD:-auth}@postgres:5432/${AUTH_DB_NAME:-auth}?schema=public
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - platform

  ms-auth:
    <<: *app-base
    build:
      context: ${AUTH_CONTEXT:-../ms-auth}
      target: production
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth}:${AUTH_DB_PASSWORD:-auth}@postgres:5432/${AUTH_DB_NAME:-auth}?schema=public
      AUTH_PRIVATE_KEY_FILE: /keys/signing-key.pem
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@ms-platform.local}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-admin-dev-password}
    ports:
      - "127.0.0.1:${AUTH_PORT:-3002}:8080"
    volumes:
      - auth_keys:/keys:ro
    depends_on:
      auth-keygen:
        condition: service_completed_successfully
      auth-migrate:
        condition: service_completed_successfully
    healthcheck: *app-healthcheck

  # ------------------------------------------------------------------ Catalog
  catalog-migrate:
    build:
      context: ${CATALOG_CONTEXT:-../ms-catalog}
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${CATALOG_DB_USER:-catalog}:${CATALOG_DB_PASSWORD:-catalog}@postgres:5432/${CATALOG_DB_NAME:-catalog}?schema=public
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - platform

  ms-catalog:
    <<: *app-base
    build:
      context: ${CATALOG_CONTEXT:-../ms-catalog}
      target: production
    environment:
      <<: *kafka-env
      DATABASE_URL: postgresql://${CATALOG_DB_USER:-catalog}:${CATALOG_DB_PASSWORD:-catalog}@postgres:5432/${CATALOG_DB_NAME:-catalog}?schema=public
    ports:
      - "127.0.0.1:${CATALOG_PORT:-3000}:8080"
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *app-healthcheck

  # ---------------------------------------------------------------- Transport
  transport-migrate:
    build:
      context: ${TRANSPORT_CONTEXT:-../ms-transport}
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${TRANSPORT_DB_USER:-transport}:${TRANSPORT_DB_PASSWORD:-transport}@postgres:5432/${TRANSPORT_DB_NAME:-transport}?schema=public
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - platform

  ms-transport:
    <<: *app-base
    build:
      context: ${TRANSPORT_CONTEXT:-../ms-transport}
      target: production
    environment:
      <<: *kafka-env
      DATABASE_URL: postgresql://${TRANSPORT_DB_USER:-transport}:${TRANSPORT_DB_PASSWORD:-transport}@postgres:5432/${TRANSPORT_DB_NAME:-transport}?schema=public
      CATALOG_SYNC_GROUP_ID: ${CATALOG_SYNC_GROUP_ID:-ms-transport.catalog-item-sync}
    ports:
      - "127.0.0.1:${TRANSPORT_PORT:-3001}:8080"
    depends_on:
      transport-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *app-healthcheck

  # ----------------------------------------------------------------- Customer
  customer-migrate:
    build:
      context: ${CUSTOMER_CONTEXT:-../ms-customer}
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${CUSTOMER_DB_USER:-customer}:${CUSTOMER_DB_PASSWORD:-customer}@postgres:5432/${CUSTOMER_DB_NAME:-customer}?schema=public
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - platform

  ms-customer:
    <<: *app-base
    build:
      context: ${CUSTOMER_CONTEXT:-../ms-customer}
      target: production
    environment:
      <<: *kafka-env
      DATABASE_URL: postgresql://${CUSTOMER_DB_USER:-customer}:${CUSTOMER_DB_PASSWORD:-customer}@postgres:5432/${CUSTOMER_DB_NAME:-customer}?schema=public
    ports:
      - "127.0.0.1:${CUSTOMER_PORT:-3003}:8080"
    depends_on:
      customer-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *app-healthcheck

  # -------------------------------------------------------------- Sales order
  sales-order-migrate:
    build:
      context: ${SALES_ORDER_CONTEXT:-../ms-sales-order}
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${SALES_ORDER_DB_USER:-sales_order}:${SALES_ORDER_DB_PASSWORD:-sales_order}@postgres:5432/${SALES_ORDER_DB_NAME:-sales_order}?schema=public
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    networks:
      - platform

  ms-sales-order:
    <<: *app-base
    build:
      context: ${SALES_ORDER_CONTEXT:-../ms-sales-order}
      target: production
    environment:
      <<: *kafka-env
      DATABASE_URL: postgresql://${SALES_ORDER_DB_USER:-sales_order}:${SALES_ORDER_DB_PASSWORD:-sales_order}@postgres:5432/${SALES_ORDER_DB_NAME:-sales_order}?schema=public
    ports:
      - "127.0.0.1:${SALES_ORDER_PORT:-3004}:8080"
    depends_on:
      sales-order-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *app-healthcheck

  # --------------------------------------------------------- Observabilidade
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - platform

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - platform

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - platform

  # Coleta os logs (stdout JSON do pino) dos containers deste compose pelo
  # socket do Docker e envia ao Loki.
  alloy:
    image: grafana/alloy:v1.4.3
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - platform

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - platform

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-ms-platform_postgres_data}
  kafka_data:
    name: ${KAFKA_VOLUME:-ms-catalog_kafka_data}
  auth_keys:
    name: ${AUTH_KEYS_VOLUME:-ms-platform_auth_keys}
  prometheus_data:
    name: ${PROMETHEUS_VOLUME:-ms-platform_prometheus_data}
  loki_data:
    name: ${LOKI_VOLUME:-ms-platform_loki_data}
  grafana_data:
    name: ${GRAFANA_VOLUME:-ms-platform_grafana_data}

networks:
  platform:
    driver: bridge
