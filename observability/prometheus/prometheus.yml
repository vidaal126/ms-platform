# Scrape dos 6 servicos (GET /metrics na rede interna) e do kafka-exporter
# (lag dos consumer groups). O gateway serve /metrics so na porta interna
# METRICS_PORT (9464), nunca na porta publica.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets:
          - ms-gateway:9464
          - ms-auth:8080
          - ms-catalog:8080
          - ms-transport:8080
          - ms-customer:8080
          - ms-sales-order:8080

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
